<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560"
     role="img" aria-label="Unidad ejecutiva de la flota">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e1e"/>
      <stop offset="0.5" stop-color="#151515"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="deck" x1="0.15" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eff1f3"/>
      <stop offset="0.32" stop-color="#d2d6da"/>
      <stop offset="0.7" stop-color="#949aa0"/>
      <stop offset="1" stop-color="#61666b"/>
    </linearGradient>

    <linearGradient id="flank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#868b90"/>
      <stop offset="0.4" stop-color="#585d62"/>
      <stop offset="1" stop-color="#2a2e32"/>
    </linearGradient>

    <linearGradient id="glass" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#63768a"/>
      <stop offset="0.4" stop-color="#2a3945"/>
      <stop offset="1" stop-color="#0c141a"/>
    </linearGradient>

    <linearGradient id="tire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>

    <linearGradient id="rim" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#eef0f2"/>
      <stop offset="0.5" stop-color="#b1b6bb"/>
      <stop offset="1" stop-color="#696e73"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1b1b"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>

    <linearGradient id="reflectFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="reflectMask">
      <rect x="0" y="434" width="900" height="126" fill="url(#reflectFade)"/>
    </mask>

    <path id="silueta" d="M152 370
             Q145 338 158 316
             L248 308
             L304 306
             Q348 298 374 240
             L524 238
             L600 302
             L694 306
             Q764 312 780 340
             Q784 362 772 372
             L708 386
             A44 44 0 0 0 620 386
             L336 386
             A44 44 0 0 0 248 386
             L168 386
             Q152 384 152 370
             Z"/>
  </defs>

  <!-- Fondo -->
  <rect width="900" height="560" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="410" ry="300" fill="url(#glow)"/>

  <!-- Horizonte urbano sugerido -->
  <g fill="#ffffff" opacity="0.045">
    <rect x="22" y="286" width="52" height="148"/>
    <rect x="86" y="248" width="38" height="186"/>
    <rect x="136" y="308" width="64" height="126"/>
    <rect x="212" y="266" width="44" height="168"/>
    <rect x="268" y="320" width="70" height="114"/>
    <rect x="350" y="280" width="40" height="154"/>
    <rect x="402" y="326" width="58" height="108"/>
    <rect x="472" y="294" width="46" height="140"/>
    <rect x="530" y="320" width="66" height="114"/>
    <rect x="608" y="272" width="42" height="162"/>
    <rect x="662" y="310" width="62" height="124"/>
    <rect x="736" y="286" width="48" height="148"/>
    <rect x="796" y="324" width="50" height="110"/>
  </g>

  <!-- Pavimento -->
  <rect y="434" width="900" height="126" fill="url(#floorFade)"/>
  <rect y="434" width="900" height="1.3" fill="#4c4f52" opacity="0.6"/>

  <!-- Sombra de contacto -->
  <ellipse cx="466" cy="438" rx="292" ry="13" fill="#000000" opacity="0.62"/>
  <ellipse cx="466" cy="436" rx="200" ry="6.5" fill="#000000" opacity="0.5"/>

  <!-- Reflejo atenuado -->
  <g mask="url(#reflectMask)" opacity="0.12">
    <use href="#silueta" transform="translate(0, 868) scale(1, -1)" fill="#ffffff"/>
  </g>

  <!-- ============================ VEHÍCULO ============================ -->
  <g>
    <use href="#silueta" fill="url(#flank)"/>

    <!-- Volumen superior: cajuela, techo y cofre -->
    <path d="M158 316
             L248 308
             L304 306
             Q348 298 374 240
             L524 238
             L600 302
             L694 306
             Q666 296 618 290
             Q512 280 396 282
             Q268 288 158 316
             Z"
          fill="url(#deck)"/>

    <!-- Línea de carácter del costado -->
    <path d="M182 334 Q460 314 774 340" stroke="#ffffff" stroke-opacity="0.15"
          stroke-width="1.5" fill="none"/>

    <!-- Cristales -->
    <g>
      <path d="M316 300
               L380 246
               Q388 241 402 241
               L520 241
               Q534 243 546 255
               L590 300
               Z" fill="url(#glass)"/>
      <path d="M452 242 L452 300" stroke="#0c1218" stroke-width="7"/>
      <path d="M320 296 L384 248" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.8" fill="none"/>
      <path d="M524 250 L560 278 L488 296 L456 246 Z" fill="url(#sheen)" opacity="0.3"/>
      <path d="M400 244 L418 244 L390 296 L362 296 Z" fill="#ffffff" opacity="0.05"/>
    </g>

    <!-- Arcos de rueda -->
    <path d="M248 386 A44 44 0 0 1 336 386" stroke="#000000" stroke-opacity="0.42"
          stroke-width="3" fill="none"/>
    <path d="M620 386 A44 44 0 0 1 708 386" stroke="#000000" stroke-opacity="0.42"
          stroke-width="3" fill="none"/>
    <path d="M292 386 Q466 394 664 386" stroke="#000000" stroke-opacity="0.28"
          stroke-width="3" fill="none"/>

    <!-- Faros, calaveras y detalles -->
    <g>
      <path d="M742 316 L778 324 L780 342 L738 338 Z" fill="#f7f9fb" opacity="0.92"/>
      <path d="M736 356 L780 356 L780 366 L738 366 Z" fill="#e9ebed" opacity="0.36"/>
      <path d="M156 328 L198 318 L198 336 L158 342 Z" fill="#c0272d" opacity="0.88"/>
      <path d="M160 356 L202 352 L202 362 L162 364 Z" fill="#c0272d" opacity="0.36"/>
      <rect x="376" y="316" width="46" height="6" rx="3" fill="#eceef0" opacity="0.48"/>
      <rect x="524" y="314" width="46" height="6" rx="3" fill="#eceef0" opacity="0.48"/>
      <path d="M420 324 L424 386" stroke="#1c2024" stroke-width="1.8" opacity="0.5" fill="none"/>
      <path d="M600 314 L604 386" stroke="#1c2024" stroke-width="1.8" opacity="0.5" fill="none"/>
      <path d="M464 300 L464 318" stroke="#1c2024" stroke-width="2.4" opacity="0.45"/>
      <path d="M592 288 L624 282 L626 294 L596 299 Z" fill="#5b6065"/>
      <circle cx="226" cy="336" r="9" fill="none" stroke="#3d4247" stroke-width="1.6" opacity="0.65"/>
    </g>

    <!-- Ruedas -->
    <g>
      <circle cx="292" cy="386" r="44" fill="url(#tire)"/>
      <circle cx="292" cy="386" r="44" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="292" cy="386" r="25" fill="url(#rim)"/>
      <circle cx="292" cy="386" r="25" fill="none" stroke="#5d6267" stroke-width="1.4"/>
      <circle cx="292" cy="386" r="6" fill="#3b3f43"/>
      <g stroke="#7d8287" stroke-width="3.2" opacity="0.7">
        <path d="M292 364 L292 408 M270 386 L314 386 M276 370 L308 402 M308 370 L276 402"/>
      </g>

      <circle cx="664" cy="386" r="44" fill="url(#tire)"/>
      <circle cx="664" cy="386" r="44" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="664" cy="386" r="25" fill="url(#rim)"/>
      <circle cx="664" cy="386" r="25" fill="none" stroke="#5d6267" stroke-width="1.4"/>
      <circle cx="664" cy="386" r="6" fill="#3b3f43"/>
      <g stroke="#7d8287" stroke-width="3.2" opacity="0.7">
        <path d="M664 364 L664 408 M642 386 L686 386 M648 370 L680 402 M680 370 L648 402"/>
      </g>
    </g>

    <!-- Brillo tenue del techo -->
    <path d="M380 246 Q450 240 520 245 L518 250 Q450 245 384 251 Z"
          fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Integración con el fondo -->
  <rect y="510" width="900" height="50" fill="#080808" opacity="0.9"/>
</svg>
