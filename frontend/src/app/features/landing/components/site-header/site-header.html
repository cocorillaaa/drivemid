<!-- Encabezado del sitio público -->
<header [class]="'dl-header' + (scrolled() ? ' is-scrolled' : '')">
  <div class="container">
    <nav class="dl-header__bar" aria-label="Navegación principal">
      <!-- Marca -->
      <a class="dl-brand" routerLink="/" (click)="closeMenu()" [attr.aria-label]="brandName() + ', inicio'">
        <img
          class="dl-logo dl-logo--sm"
          src="images/logo-drivemid.png"
          alt=""
          width="512"
          height="512"
          aria-hidden="true"
        />
        @if (demoBadge(); as chip) {
          <span class="dl-demo-chip">{{ chip }}</span>
        }
      </a>

      <!-- Navegación de escritorio -->
      <ul class="dl-nav d-none d-lg-flex">
        @for (link of navLinks; track link.href) {
          <li><a class="dl-nav__link" [href]="link.href">{{ link.label }}</a></li>
        }
      </ul>

      <!-- Acciones -->
      <div class="d-none d-lg-flex align-items-center gap-2">
        @if (contact(); as datos) {
          <button type="button" class="dl-header__phone" (click)="copyPhone()">
            <span>{{ datos.phone }}</span>
          </button>
        }
        <a class="dl-btn dl-btn--dark dl-btn--sm" routerLink="/acceso">Acceso a Plataforma</a>
      </div>

      <!-- Botón de menú móvil -->
      <button
        type="button"
        class="dl-burger d-lg-none"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="dl-mobile-menu"
        aria-label="Abrir menú de navegación"
        (click)="toggleMenu()"
      >
        {{ menuOpen() ? 'Cerrar' : 'Menú' }}
      </button>
    </nav>
  </div>

  <!-- Menú móvil -->
  @if (menuOpen()) {
    <div id="dl-mobile-menu" class="dl-mobile-menu d-lg-none">
      <div class="container">
        <ul class="list-unstyled mb-3">
          @for (link of navLinks; track link.href) {
            <li>
              <a class="dl-mobile-menu__link" [href]="link.href" (click)="closeMenu()">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
        <a class="dl-btn dl-btn--dark dl-btn--block" routerLink="/acceso" (click)="closeMenu()">
          Acceso a Plataforma
        </a>
      </div>
    </div>
  }
</header>
