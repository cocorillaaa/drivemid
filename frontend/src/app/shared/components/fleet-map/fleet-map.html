<!-- Mapa interactivo de la flota (Leaflet) -->
<div
  [class]="'dl-map' + (tilesUnavailable() ? ' dl-map--offline' : '')"
  [style.height]="height()"
>
  <div #canvas class="dl-map__canvas" role="img"
       [attr.aria-label]="'Mapa de ubicación de ' + markers().length + ' unidades de la flota'"></div>

  @if (tilesUnavailable()) {
    <div class="dl-map__overlay dl-map__overlay--bl">
      <span style="font-size: 0.6875rem; color: var(--dl-slate)">
Capa base no disponible · coordenadas activas
      </span>
    </div>
  }
</div>
