<!-- Tarjeta ejecutiva de métrica -->
<article [class]="'dl-stat' + (accent() ? ' dl-stat--accent' : '')">
  <p class="dl-stat__label">{{ label() }}</p>

  <p class="dl-stat__value">
    {{ value() }}
    @if (unit()) {
      <span class="dl-stat__unit">{{ unit() }}</span>
    }
  </p>

  @if (hint()) {
    <p class="dl-stat__hint">{{ hint() }}</p>
  }
</article>
